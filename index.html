<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>《燕雲十六聲》百業戰戰術指引沙盤</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f17;
      --panel-bg: #131b2e;
      --panel-border: #263554;
      --gold-accent: #eab308;
      --blue-camp: #3b82f6;
      --red-camp: #ef4444;
      --green-camp: #10b981;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: #f1f5f9;
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 手機版直立時提示橫向放置 */
    #portrait-warning {
      display: none;
    }
    @media (max-width: 960px) and (orientation: portrait) {
      #portrait-warning {
        display: flex !important;
      }
    }

    /* 強制 16:9 橫向主容器，自動適配 PC 與手機橫向視窗 */
    #app-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
      background: #0f172a;
      border: 1px solid #1e293b;
      display: flex;
      flex-direction: row;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    }

    /* 自訂捲軸美化 */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(234, 179, 8, 0.75);
    }

    /* 地圖點位標記互動與發光動畫 */
    .map-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
      z-index: 10;
    }
    .map-hotspot:hover {
      transform: translate(-50%, -50%) scale(1.18);
      z-index: 30;
    }
    .map-hotspot.selected-spot {
      z-index: 35;
    }
    .map-hotspot.selected-spot .spot-core {
      outline: 2.5px solid #facc15;
      outline-offset: 2px;
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.95);
    }

    /* 特定時間軸高亮：放大、發光、目標提示框 */
    @keyframes targetPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1.16);
        filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.95));
      }
      50% {
        transform: translate(-50%, -50%) scale(1.30);
        filter: drop-shadow(0 0 16px rgba(245, 158, 11, 1));
      }
    }
    @keyframes frameBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.12); }
    }
    .map-hotspot.timeline-highlight {
      animation: targetPulse 1.8s infinite ease-in-out;
      z-index: 25;
    }
    .target-reticle {
      display: none;
      position: absolute;
      inset: -7px;
      border: 2px solid #facc15;
      border-radius: 6px;
      pointer-events: none;
      box-shadow: inset 0 0 8px rgba(250, 204, 21, 0.6), 0 0 12px rgba(250, 204, 21, 0.8);
      animation: frameBlink 1.5s infinite ease-in-out;
    }
    .map-hotspot.timeline-highlight .target-reticle {
      display: block;
    }

    /* 動態字級適應 16:9 縮放 */
    .text-fluid-xs { font-size: clamp(9px, 0.72vw, 12px); }
    .text-fluid-sm { font-size: clamp(10px, 0.85vw, 14px); }
    .text-fluid-base { font-size: clamp(11px, 1vw, 16px); }
    .text-fluid-lg { font-size: clamp(13px, 1.2vw, 20px); }

    /* 自訂防超出螢幕下拉選單 */
    .custom-dropdown-menu {
      position: fixed;
      z-index: 9999;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
      max-height: min(210px, 48vh);
      overflow-y: auto;
      display: none;
    }
    .custom-dropdown-menu.open {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 手機直立旋轉提示遮罩 -->
  <div id="portrait-warning" class="fixed inset-0 z-[99999] bg-slate-950/95 flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 mb-4 rounded-2xl bg-amber-500/20 border border-amber-400/50 flex items-center justify-center text-amber-400">
      <svg class="w-10 h-10 animate-spin" style="animation-duration: 3s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </div>
    <div class="text-lg font-bold text-amber-400 mb-2">請將手機橫向放置</div>
    <div class="text-sm text-slate-300 max-w-xs">本戰術沙盤採用 16:9 橫向比例設計，請將裝置旋轉為橫向以獲得完整操作視野。</div>
  </div>

    // 判斷指定分鐘數所屬的階段區間、系統事件與高亮點位清單
    function getPhaseMetaByMinute(min) {
      if (min >= 26) {
        return {
          phaseLabel: "開局階段 (30分~26分)",
          range: [30, 29, 28, 27, 26],
          systemEvent: "戰場開啟：八個野區初始生成，雙方三路人牆升起。",
          highlightIds: [...JUNGLE_IDS]
        };
      } else if (min >= 21) {
        return {
          phaseLabel: "首領爭奪期 (25分~21分)",
          range: [25, 24, 23, 22, 21],
          systemEvent: "25分關鍵事件：上路野怪BOSS、下路野怪BOSS登場，全地圖八個野區同步刷新。",
          highlightIds: [...BOSS_IDS, ...JUNGLE_IDS]
        };
      } else if (min >= 16) {
        return {
          phaseLabel: "中場表演期 (20分~16分)",
          range: [20, 19, 18, 17, 16],
          systemEvent: "20分關鍵事件：中央「中場表演場地」單挑決鬥開啟，全地圖八個野區同步刷新。",
          highlightIds: ["center_stage", ...JUNGLE_IDS]
        };
      } else if (min >= 11) {
        return {
          phaseLabel: "中期首領期 (15分~11分)",
          range: [15, 14, 13, 12, 11],
          systemEvent: "15分關鍵事件：上路野怪BOSS、下路野怪BOSS登場，全地圖八個野區同步刷新。",
          highlightIds: [...BOSS_IDS, ...JUNGLE_IDS]
        };
      } else if (min >= 6) {
        return {
          phaseLabel: "後期推進期 (10分~6分)",
          range: [10, 9, 8, 7, 6],
          systemEvent: "10分關鍵事件：全地圖八個野區刷新，進入擊殺大鵝與搬運發財樹關鍵階段。",
          highlightIds: [...JUNGLE_IDS]
        };
      } else {
        return {
          phaseLabel: "最終決戰期 (5分~0分)",
          range: [5, 4, 3, 2, 1, 0],
          systemEvent: "5分關鍵事件：決戰上／下路野怪BOSS登場，八個野區最後刷新，護送發財樹衝門奪勝。",
          highlightIds: [...BOSS_IDS, ...JUNGLE_IDS]
        };
      }
    }

    // 預設成員名單 (示範三組分類與雙武學搭配，使用者可自由新增超過30人)
    function createDefaultMembers() {
      return [
        { memberId: "蒼狼破軍", martialArt1: "嗟夫刀法", martialArt2: "八方風雷槍", group: "進攻組" },
        { memberId: "劍影無痕", martialArt1: "積矩九劍", martialArt2: "九曲驚神槍", group: "進攻組" },
        { memberId: "赤焰驚鴻", martialArt1: "無名劍法", martialArt2: "無名槍法", group: "進攻組" },
        { memberId: "青嵐聽雨", martialArt1: "明川藥典", martialArt2: "千香引魂蠱", group: "進攻組" },
        { memberId: "凌霄劍客", martialArt1: "積矩九劍", martialArt2: "無名劍法", group: "進攻組" },
        { memberId: "墨染江山", martialArt1: "九重春色", martialArt2: "青山執筆", group: "防守組" },
        { memberId: "玄鐵重盾", martialArt1: "嗟夫刀法", martialArt2: "無名槍法", group: "防守組" },
        { memberId: "雲裳花容", martialArt1: "千香引魂蠱", martialArt2: "明川藥典", group: "防守組" },
        { memberId: "鎮岳狂瀾", martialArt1: "八方風雷槍", martialArt2: "嗟夫刀法", group: "防守組" },
        { memberId: "疾風殘影", martialArt1: "泥犁三垢", martialArt2: "粟子游塵", group: "機動組" },
        { memberId: "夜行千里", martialArt1: "泥犁三垢", martialArt2: "無名劍法", group: "機動組" },
        { memberId: "追風逐月", martialArt1: "粟子游塵", martialArt2: "積矩九劍", group: "機動組" }
      ];
    }

    function createDefaultHpStatus() {
      return {
        blue_base: 100,
        red_base: 100,
        blue_wall_top: 100,
        blue_wall_mid: 100,
        blue_wall_bot: 100,
        red_wall_top: 100,
        red_wall_mid: 100,
        red_wall_bot: 100
      };
    }

    function createDefaultTimeline() {
      const timeline = {};
      for (let m = 30; m >= 0; m--) {
        let tacticName = "開局清野與三路推進";
        let skills = ["全隊增益"];
        let action = "1. 機動組迅速清空八個野區累積百業幣\n2. 進攻組集結壓制敵方上中下人牆\n3. 防守組駐守己方人牆防止敵方雙刀偷塔";
        const deployments = {};

        if (m <= 25 && m >= 21) {
          tacticName = "首領爭奪與外野壓制";
          skills = ["全隊增益", "快速復活"];
          action = "1. 進攻組主力集結爭奪上／下路野怪BOSS\n2. 機動組分頭掃蕩八個野區拉開百業幣差距\n3. 防守組協防中路與下路據點";
        } else if (m <= 20 && m >= 16) {
          tacticName = "中場單挑與破牆攻勢";
          skills = ["全隊增益", "打鵝傷害"];
          action = "1. 指派單挑高手進入中場表演場地奪取扣血優勢\n2. 機動組清空八個野區\n3. 進攻組趁勢破除敵方人牆開啟打鵝權限";
        } else if (m <= 15 && m >= 11) {
          tacticName = "中期首領與斬鵝行動";
          skills = ["全隊增益", "打鵝傷害", "快速復活"];
          action = "1. 搶奪 15 分上／下路野怪BOSS獲取增傷\n2. 機動組清剿八個野區\n3. 進攻組深入敵陣集火擊殺敵方大鵝";
        } else if (m <= 10 && m >= 6) {
          tacticName = "後期野區控制與搬樹推進";
          skills = ["搬樹加速", "無視攔截"];
          action = "1. 10分刷野迅速清空補充百業幣\n2. 擊殺敵方大鵝後由坦克與奶媽護送搬運發財樹\n3. 防守組於中路攔截敵方反撲";
        } else if (m <= 5) {
          tacticName = "決戰首領與護樹衝門";
          skills = ["全隊增益", "搬樹加速", "無視攔截", "快速復活"];
          action = "1. 5分爭奪決戰BOSS（朱骨）翻盤增傷Buff\n2. 指揮官技能全開，全軍掩護發財樹穿過己方大門奪取勝利";
        }

        timeline[String(m)] = {
          minute: m,
          tacticName,
          commanderSkills: skills,
          tacticAction: action,
          hpStatus: createDefaultHpStatus(),
          deployments
        };
      }
      return timeline;
    }

    // 系統全域狀態
    const state = {
      currentMinute: 30,
      selectedSpotId: "blue_jg_top_in",
      showSpotNames: true,
      showSpotMembers: true,
      members: createDefaultMembers(),
      timeline: createDefaultTimeline(),
      availableSkills: [...DEFAULT_COMMANDER_SKILLS],
      tempSelectedSkills: [],
      rosterForm: {
        martialArt1: "無名劍法",
        martialArt2: "無名槍法",
        group: "進攻組"
      }
    };

    // LocalStorage 安全存取與 GAS 雙向同步
    const STORAGE_KEY = "yanyun_baiye_tactics_v1";

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.members) && parsed.members.length > 0) {
          state.members = parsed.members;
        }
        if (parsed.timeline && typeof parsed.timeline === "object") {
          Object.keys(parsed.timeline).forEach(k => {
            if (state.timeline[k]) {
              state.timeline[k] = Object.assign({}, state.timeline[k], parsed.timeline[k]);
              state.timeline[k].hpStatus = Object.assign(createDefaultHpStatus(), parsed.timeline[k].hpStatus || {});
              state.timeline[k].deployments = parsed.timeline[k].deployments || {};
            }
          });
        }
      } catch (e) {
        console.warn("Local storage load skipped:", e);
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          members: state.members,
          timeline: state.timeline
        }));
      } catch (e) {
        console.warn("Local storage save skipped:", e);
      }
    }

    function isGasConfigured() {
      return (
        typeof GAS_WEB_APP_URL === "string" &&
        GAS_WEB_APP_URL.trim().length > 0 &&
        !GAS_WEB_APP_URL.includes("請替換為你的部署網址")
      );
    }

    function setSyncBadge(text, tone) {
      const badge = document.getElementById("sync-status-badge");
      if (!badge) return;
      badge.textContent = text;
      badge.className = "ml-1 px-1.5 py-0.5 rounded text-fluid-xs font-medium border cursor-pointer hover:opacity-80 transition ";
      if (tone === "syncing") {
        badge.className += "bg-amber-500/20 border-amber-500/40 text-amber-300";
      } else if (tone === "error") {
        badge.className += "bg-rose-500/20 border-rose-500/40 text-rose-300";
      } else {
        badge.className += "bg-emerald-500/20 border-emerald-500/40 text-emerald-300";
      }
    }

    async function fetchFromGas() {
      if (!isGasConfigured()) {
        setSyncBadge("本機模式", "ok");
        return;
      }
      setSyncBadge("雲端讀取中...", "syncing");
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();
        if (data && data.status === "ok") {
          if (Array.isArray(data.members) && data.members.length > 0) {
            state.members = data.members;
          }
          if (data.timeline) {
            Object.keys(data.timeline).forEach(k => {
              if (state.timeline[k]) {
                state.timeline[k] = Object.assign({}, state.timeline[k], data.timeline[k]);
                state.timeline[k].hpStatus = Object.assign(createDefaultHpStatus(), data.timeline[k].hpStatus || {});
                state.timeline[k].deployments = data.timeline[k].deployments || {};
              }
            });
          }
          saveLocalState();
          renderAll();
          setSyncBadge("雲端已同步", "ok");
        } else {
          throw new Error(data && data.message ? data.message : "GAS returned non-ok status");
        }
      } catch (err) {
        console.warn("GAS fetch error:", err);
        setSyncBadge("本機模式", "error");
      }
    }

    async function pushToGas(actionType, subsetTimeline) {
      saveLocalState();
      if (!isGasConfigured()) {
        setSyncBadge("已存本機", "ok");
        return;
      }
      setSyncBadge("雲端儲存中...", "syncing");
      try {
        const payload = {
          action: actionType || "saveAll",
          members: state.members,
          timeline: subsetTimeline || state.timeline
        };
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const data = await res.json();
        if (data && data.status === "ok") {
          setSyncBadge("雲端已同步", "ok");
        } else {
          setSyncBadge("已存本機", "error");
        }
      } catch (err) {
        console.warn("GAS push error:", err);
        setSyncBadge("已存本機", "error");
      }
    }

    // 取得成員物件與組別色彩
    function getMemberById(memberId) {
      return state.members.find(m => m.memberId === memberId) || null;
    }

    function getGroupBadgeStyle(group) {
      if (group === "進攻組") return "bg-rose-600/90 text-white border-rose-400";
      if (group === "防守組") return "bg-sky-600/90 text-white border-sky-400";
      return "bg-emerald-600/90 text-white border-emerald-400";
    }

    // 查詢某成員在指定分鐘是否已被指派於某個點位 (用於同一時間點位防重疊)
    function findMemberSpotAtMinute(minute, memberId) {
      const minData = state.timeline[String(minute)];
      if (!minData || !minData.deployments) return null;
      for (const spot of MAP_SPOTS) {
        const list = minData.deployments[spot.id] || [];
        if (list.includes(memberId)) {
          return spot;
        }
      }
      return null;
    }

    // ============================================================================
    // 介面渲染：地圖 21 個點位、時間軸、右側資訊卡
    // ============================================================================
    function renderHotspots() {
      const container = document.getElementById("hotspots-layer");
      if (!container) return;
      const minData = state.timeline[String(state.currentMinute)];
      const phaseMeta = getPhaseMetaByMinute(state.currentMinute);
      const highlightSet = new Set(phaseMeta.highlightIds);

      container.innerHTML = "";

      MAP_SPOTS.forEach(spot => {
        const isHighlighted = highlightSet.has(spot.id);
        const isSelected = state.selectedSpotId === spot.id;
        const deployedIds = (minData.deployments && minData.deployments[spot.id]) ? minData.deployments[spot.id] : [];
        const hpVal = spot.hasHp ? (minData.hpStatus?.[spot.id] ?? 100) : null;

        const el = document.createElement("div");
        el.className = `map-hotspot ${isHighlighted ? "timeline-highlight" : ""} ${isSelected ? "selected-spot" : ""}`;
        el.style.left = `${spot.x}%`;
        el.style.top = `${spot.y}%`;
        el.dataset.spotId = spot.id;

        // 依點位類型決定核心標記外觀
        let coreStyle = "w-4 h-4 rounded-full bg-rose-600/90 border-2 border-white shadow-md";
        if (spot.type === "三路防禦") {
          coreStyle = "w-4 h-4 rotate-45 rounded-sm bg-sky-500/90 border-2 border-white shadow-md";
        } else if (spot.type === "基地核心") {
          coreStyle = spot.camp === "blue"
            ? "w-5 h-5 rounded-full bg-blue-600 border-2 border-amber-300 shadow-lg"
            : "w-5 h-5 rounded-full bg-rose-600 border-2 border-amber-300 shadow-lg";
        } else if (spot.type === "南北首領") {
          coreStyle = "w-5 h-5 rounded-md bg-red-700 border-2 border-amber-300 shadow-lg";
        } else if (spot.type === "南北據點") {
          coreStyle = "w-4 h-4 rounded-md bg-emerald-600 border-2 border-white shadow-md";
        } else if (spot.type === "中央核心") {
          coreStyle = "w-5 h-5 rounded-md bg-amber-500 border-2 border-slate-950 shadow-lg";
        }

        // 血量條 HTML (針對人牆與樹+鵝)
        let hpHtml = "";
        if (spot.hasHp) {
          const barColor = hpVal > 50 ? "bg-emerald-400" : hpVal > 20 ? "bg-amber-400" : "bg-rose-500";
          hpHtml = `
            <div class="mb-0.5 px-1 py-0.5 rounded bg-slate-950/90 border border-slate-700 flex items-center gap-1 whitespace-nowrap">
              <div class="w-8 h-1.5 bg-slate-800 rounded overflow-hidden">
                <div class="${barColor} h-full" style="width:${hpVal}%"></div>
              </div>
              <span class="text-[9px] font-black ${hpVal === 0 ? 'text-rose-400' : 'text-white'}">${hpVal}%</span>
            </div>
          `;
        }

        // 點位名稱與人數徽章
        const showName = state.showSpotNames || isSelected || isHighlighted;
        const countBadge = deployedIds.length > 0
          ? `<span class="ml-0.5 px-1 rounded bg-amber-400 text-slate-950 font-black">${deployedIds.length}人</span>`
          : "";

        const nameHtml = showName ? `
          <div class="mt-0.5 px-1.5 py-0.5 rounded bg-slate-950/90 border ${isHighlighted ? 'border-amber-400 text-amber-200' : 'border-slate-700 text-slate-100'} text-[9px] font-bold whitespace-nowrap flex items-center shadow">
            <span>${spot.short}</span>
            ${countBadge}
          </div>
        ` : (deployedIds.length > 0 ? `
          <div class="mt-0.5 px-1 py-0.5 rounded bg-amber-400 text-slate-950 text-[9px] font-black whitespace-nowrap shadow">
            ${deployedIds.length}人
          </div>
        ` : "");

        // 展開駐守成員 ID 小名牌 (供戰術檢視)
        let memberTagsHtml = "";
        if (state.showSpotMembers && deployedIds.length > 0) {
          const previewIds = deployedIds.slice(0, 4).map(id => {
            const m = getMemberById(id);
            const gStyle = m ? getGroupBadgeStyle(m.group) : "bg-slate-700 text-white";
            return `<span class="px-1 rounded text-[8px] font-bold border ${gStyle}">${id}</span>`;
          }).join("");
          const moreTag = deployedIds.length > 4
            ? `<span class="px-1 rounded text-[8px] font-bold bg-slate-800 text-amber-300">+${deployedIds.length - 4}</span>`
            : "";
          memberTagsHtml = `
            <div class="mt-0.5 flex flex-wrap justify-center gap-0.5 max-w-[115px]">
              ${previewIds}${moreTag}
            </div>
          `;
        }

        el.innerHTML = `
          <div class="flex flex-col items-center">
            ${hpHtml}
            <div class="relative flex items-center justify-center">
              <div class="target-reticle"></div>
              <div class="spot-core ${coreStyle}"></div>
            </div>
            ${nameHtml}
            ${memberTagsHtml}
          </div>
        `;

        el.addEventListener("click", (e) => {
          e.stopPropagation();
          state.selectedSpotId = spot.id;
          renderAll();
        });

        container.appendChild(el);
      });
    }

    function renderTimeline() {
      const quickBar = document.getElementById("quick-jump-bar");
      const track = document.getElementById("timeline-nodes-track");
      if (!quickBar || !track) return;

      const quickMinutes = [30, 25, 20, 15, 10, 5, 0];
      quickBar.innerHTML = "";
      quickMinutes.forEach(m => {
        const isCurrentPhase = getPhaseMetaByMinute(state.currentMinute).range.includes(m) && (
          state.currentMinute === m || (m > 0 && state.currentMinute <= m && state.currentMinute > m - 5)
        );
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `px-2 py-0.5 rounded text-fluid-xs font-black transition border ${
          state.currentMinute === m
            ? "bg-amber-400 text-slate-950 border-amber-300 shadow"
            : isCurrentPhase
            ? "bg-amber-500/20 text-amber-300 border-amber-500/50"
            : "bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700"
        }`;
        btn.textContent = `${m}分`;
        btn.addEventListener("click", () => selectMinute(m, true));
        quickBar.appendChild(btn);
      });

      const specialSet = new Set([25, 20, 15, 10, 5]);
      track.innerHTML = "";

      for (let m = 30; m >= 0; m--) {
        const isSelected = state.currentMinute === m;
        const isSpecial = specialSet.has(m);
        const minData = state.timeline[String(m)];
        const deployedCount = Object.values(minData?.deployments || {}).reduce((acc, arr) => acc + (arr ? arr.length : 0), 0);

        const node = document.createElement("button");
        node.type = "button";
        node.id = `time-node-${m}`;
        node.className = `relative flex flex-col items-center justify-center min-w-[44px] py-1 px-1.5 rounded-lg border transition ${
          isSelected
            ? "bg-amber-500 text-slate-950 border-amber-300 font-black scale-105 shadow-lg z-10"
            : isSpecial
            ? "bg-slate-800/95 hover:bg-slate-700 text-amber-300 border-amber-500/60 font-bold"
            : "bg-slate-950/80 hover:bg-slate-800 text-slate-300 border-slate-800 font-medium"
        }`;

        const badgeDot = isSpecial
          ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-slate-950' : 'bg-amber-400'} mb-0.5"></span>`
          : `<span class="w-1 h-1 rounded-full ${deployedCount > 0 ? 'bg-emerald-400' : 'bg-slate-600'} mb-0.5"></span>`;

        node.innerHTML = `
          ${badgeDot}
          <span class="text-fluid-xs leading-none">${m}分</span>
        `;

        node.addEventListener("click", () => selectMinute(m, false));
        track.appendChild(node);
      }
    }

    function selectMinute(m, smoothScroll) {
      const clamped = Math.max(0, Math.min(30, m));
      state.currentMinute = clamped;
      renderAll();
      const nodeEl = document.getElementById(`time-node-${clamped}`);
      const scrollBox = document.getElementById("timeline-scroll-container");
      if (nodeEl && scrollBox) {
        const targetLeft = nodeEl.offsetLeft - scrollBox.clientWidth / 2 + nodeEl.clientWidth / 2;
        scrollBox.scrollTo({
          left: Math.max(0, targetLeft),
          behavior: smoothScroll ? "smooth" : "auto"
        });
      }
    }

    function renderRightPanel() {
      const min = state.currentMinute;
      const minData = state.timeline[String(min)];
      const phaseMeta = getPhaseMetaByMinute(min);

      // 左上角地圖覆蓋徽章
      document.getElementById("map-overlay-time").textContent = `倒數 ${min}分`;
      document.getElementById("map-overlay-phase").textContent = phaseMeta.phaseLabel;

      // 區塊 1：當前時間與戰術名稱
      document.getElementById("card-time-badge").textContent = `${min}分 (${phaseMeta.phaseLabel})`;
      document.getElementById("card-tactic-name").textContent = minData.tacticName || "未命名戰術";

      const totalDeployed = Object.values(minData.deployments || {}).reduce((sum, list) => sum + (list ? list.length : 0), 0);
      document.getElementById("card-deployed-total").textContent = `全圖已配置 ${totalDeployed} 人`;

      // 區塊 2：指揮技能
      const skillsBox = document.getElementById("card-commander-skills");
      skillsBox.innerHTML = "";
      const skills = minData.commanderSkills || [];
      if (skills.length === 0) {
        skillsBox.innerHTML = `<span class="text-fluid-xs text-slate-500">未指定指揮技能</span>`;
      } else {
        skills.forEach(sk => {
          const span = document.createElement("span");
          span.className = "px-2 py-0.5 rounded bg-amber-500/20 border border-amber-400/50 text-amber-300 text-fluid-xs font-bold";
          span.textContent = sk;
          skillsBox.appendChild(span);
        });
      }

      // 區塊 3：系統事件與戰術行動
      document.getElementById("card-system-event").textContent = phaseMeta.systemEvent;
      document.getElementById("card-tactic-action").textContent = minData.tacticAction || "點擊上方「戰術設定」按鈕編輯此階段戰術行動。";

      // 區塊 4：選中點位狀態資訊
      const spot = MAP_SPOTS.find(s => s.id === state.selectedSpotId) || MAP_SPOTS[0];
      document.getElementById("spot-detail-title").textContent = spot.name;
      document.getElementById("spot-detail-type").textContent = spot.type;

      const dotEl = document.getElementById("spot-camp-dot");
      if (spot.camp === "blue") dotEl.className = "w-2.5 h-2.5 rounded-full bg-blue-500";
      else if (spot.camp === "red") dotEl.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
      else if (spot.camp === "boss") dotEl.className = "w-2.5 h-2.5 rounded-full bg-red-600";
      else if (spot.camp === "center") dotEl.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
      else dotEl.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";

      // 血量滑桿控制 (人牆 / 樹+鵝)
      const hpBox = document.getElementById("spot-hp-box");
      if (spot.hasHp) {
        hpBox.classList.remove("hidden");
        const currentHp = minData.hpStatus?.[spot.id] ?? 100;
        document.getElementById("spot-hp-label").textContent = `${currentHp}%`;
        document.getElementById("spot-hp-slider").value = currentHp;
      } else {
        hpBox.classList.add("hidden");
      }

      // 駐守成員清單
      const deployedList = (minData.deployments && minData.deployments[spot.id]) ? minData.deployments[spot.id] : [];
      document.getElementById("spot-member-count").textContent = deployedList.length;
      const memberListBox = document.getElementById("spot-member-list");
      memberListBox.innerHTML = "";

      if (deployedList.length === 0) {
        memberListBox.innerHTML = `<span class="text-fluid-xs text-slate-500">尚未指派成員</span>`;
      } else {
        deployedList.forEach(memberId => {
          const m = getMemberById(memberId);
          const groupStyle = m ? getGroupBadgeStyle(m.group) : "bg-slate-700 text-white border-slate-500";
          const maText = m ? `${m.martialArt1}/${m.martialArt2}` : "";
          const badge = document.createElement("div");
          badge.className = `px-1.5 py-0.5 rounded border text-fluid-xs font-bold flex items-center gap-1 ${groupStyle}`;
          badge.innerHTML = `
            <span>${memberId}</span>
            ${maText ? `<span class="opacity-80 font-normal text-[9px]">(${maText})</span>` : ""}
          `;
          memberListBox.appendChild(badge);
        });
      }
    }

      renderHotspots();

    // ============================================================================
    // 自訂美化下拉選單 (自動偵測螢幕邊界，防止超出手機或電腦視窗)
    // ============================================================================
    function openCustomDropdown(anchorBtn, options, currentVal, onSelect) {
      const menu = document.getElementById("global-dropdown-menu");
      if (!menu) return;

      menu.innerHTML = "";
      options.forEach(opt => {
        const val = typeof opt === "string" ? opt : opt.name;
        const sub = typeof opt === "string" ? "" : opt.tag;
        const item = document.createElement("button");
        item.type = "button";
        item.className = `w-full px-3 py-1.5 text-left text-fluid-xs flex items-center justify-between hover:bg-slate-800 transition ${
          val === currentVal ? "bg-amber-500/20 text-amber-300 font-black" : "text-slate-200 font-medium"
        }`;
        item.innerHTML = `
          <span>${val}</span>
          ${sub ? `<span class="text-[10px] text-slate-400 ml-2">${sub}</span>` : ""}
        `;
        item.addEventListener("click", (e) => {
          e.stopPropagation();
          menu.classList.remove("open");
          onSelect(val);
        });
        menu.appendChild(item);
      });

      menu.classList.add("open");

      const rect = anchorBtn.getBoundingClientRect();
      const menuWidth = Math.max(rect.width, 180);
      menu.style.width = `${menuWidth}px`;

      const menuHeight = Math.min(210, window.innerHeight * 0.48);
      const spaceBelow = window.innerHeight - rect.bottom;
      let topPos = rect.bottom + 4;
      if (spaceBelow < menuHeight && rect.top > menuHeight) {
        topPos = rect.top - menuHeight - 4;
      }
      let leftPos = rect.left;
      if (leftPos + menuWidth > window.innerWidth - 8) {
        leftPos = window.innerWidth - menuWidth - 8;
      }
      menu.style.top = `${Math.max(8, topPos)}px`;
      menu.style.left = `${Math.max(8, leftPos)}px`;
    }

    document.addEventListener("click", () => {
      const menu = document.getElementById("global-dropdown-menu");
      if (menu) menu.classList.remove("open");
    });

    // ============================================================================
    // 視窗 1：戰術設定與指揮技能編輯
    // ============================================================================
    function openTacticModal() {
      const min = state.currentMinute;
      const minData = state.timeline[String(min)];
      const phaseMeta = getPhaseMetaByMinute(min);

      document.getElementById("tactic-modal-min-label").textContent = `${min}分`;
      document.getElementById("input-tactic-name").value = minData.tacticName || "";
      document.getElementById("input-tactic-action").value = minData.tacticAction || "";
      document.getElementById("lbl-apply-phase-tactic").textContent = `同步套用至整個 ${phaseMeta.phaseLabel}`;

      state.tempSelectedSkills = [...(minData.commanderSkills || [])];
      state.tempSelectedSkills.forEach(sk => {
        if (!state.availableSkills.includes(sk)) state.availableSkills.push(sk);
      });

      renderSkillToggles();
      document.getElementById("modal-tactic").classList.remove("hidden");
    }

    function renderSkillToggles() {
      const group = document.getElementById("skill-toggle-group");
      group.innerHTML = "";
      state.availableSkills.forEach(sk => {
        const active = state.tempSelectedSkills.includes(sk);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `px-2.5 py-1 rounded-lg text-fluid-xs font-bold border transition ${
          active
            ? "bg-amber-500 text-slate-950 border-amber-300 shadow"
            : "bg-slate-950 text-slate-400 border-slate-700 hover:border-slate-500"
        }`;
        btn.textContent = sk;
        btn.addEventListener("click", () => {
          if (state.tempSelectedSkills.includes(sk)) {
            state.tempSelectedSkills = state.tempSelectedSkills.filter(s => s !== sk);
          } else {
            state.tempSelectedSkills.push(sk);
          }
          renderSkillToggles();
        });
        group.appendChild(btn);
      });
    }

    function saveTacticModal() {
      const min = state.currentMinute;
      const phaseMeta = getPhaseMetaByMinute(min);
      const applyPhase = document.getElementById("chk-apply-phase-tactic").checked;
      const targetMins = applyPhase ? phaseMeta.range : [min];

      const newName = document.getElementById("input-tactic-name").value.trim() || "自訂戰術";
      const newAction = document.getElementById("input-tactic-action").value.trim();
      const newSkills = [...state.tempSelectedSkills];

      const updatedSubset = {};
      targetMins.forEach(m => {
        const key = String(m);
        if (state.timeline[key]) {
          state.timeline[key].tacticName = newName;
          state.timeline[key].tacticAction = newAction;
          state.timeline[key].commanderSkills = [...newSkills];
          updatedSubset[key] = state.timeline[key];
        }
      });

      document.getElementById("modal-tactic").classList.add("hidden");
      renderAll();
      pushToGas("saveTimeline", updatedSubset);
    }

    // ============================================================================
    // 視窗 2：點位成員配置 (支援進攻/防守/機動三組與同時間防重疊移轉)
    // ============================================================================
    function openAssignModal() {
      const spot = MAP_SPOTS.find(s => s.id === state.selectedSpotId) || MAP_SPOTS[0];
      const min = state.currentMinute;
      const phaseMeta = getPhaseMetaByMinute(min);

      document.getElementById("assign-modal-spot-name").textContent = spot.name;
      document.getElementById("assign-modal-time-badge").textContent = `倒數 ${min}分`;
      document.getElementById("lbl-apply-phase-assign").textContent = `同步套用此點位配置至 ${phaseMeta.phaseLabel}`;

      renderAssignLists();
      document.getElementById("modal-assign").classList.remove("hidden");
    }

    function renderAssignLists() {
      const spotId = state.selectedSpotId;
      const min = state.currentMinute;
      const minData = state.timeline[String(min)];
      const currentSpotList = (minData.deployments && minData.deployments[spotId]) ? minData.deployments[spotId] : [];

      const groupsMap = {
        "進攻組": { listEl: document.getElementById("assign-list-atk"), countEl: document.getElementById("assign-count-atk"), items: [] },
        "防守組": { listEl: document.getElementById("assign-list-def"), countEl: document.getElementById("assign-count-def"), items: [] },
        "機動組": { listEl: document.getElementById("assign-list-mob"), countEl: document.getElementById("assign-count-mob"), items: [] }
      };

      state.members.forEach(m => {
        if (groupsMap[m.group]) {
          groupsMap[m.group].items.push(m);
        } else {
          groupsMap["進攻組"].items.push(m);
        }
      });

      Object.keys(groupsMap).forEach(gName => {
        const { listEl, countEl, items } = groupsMap[gName];
        listEl.innerHTML = "";
        let checkedInGroup = 0;

        items.forEach(member => {
          const isHere = currentSpotList.includes(member.memberId);
          if (isHere) checkedInGroup++;

          const otherSpot = !isHere ? findMemberSpotAtMinute(min, member.memberId) : null;

          const row = document.createElement("button");
          row.type = "button";
          row.className = `w-full p-1.5 rounded-lg border text-left transition flex items-center justify-between ${
            isHere
              ? "bg-amber-500/20 border-amber-400 text-white"
              : otherSpot
              ? "bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-600"
              : "bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-600"
          }`;

          const locationTag = isHere
            ? `<span class="px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 text-[9px] font-black">本點位</span>`
            : otherSpot
            ? `<span class="px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 text-[9px] font-bold">位於:${otherSpot.short}</span>`
            : `<span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 text-[9px]">待命</span>`;

          row.innerHTML = `
            <div class="min-w-0 pr-1">
              <div class="text-fluid-xs font-bold truncate">${member.memberId}</div>
              <div class="text-[9px] text-slate-400 truncate">${member.martialArt1} / ${member.martialArt2}</div>
            </div>
            <div class="shrink-0">${locationTag}</div>
          `;

          row.addEventListener("click", () => toggleMemberAtSpot(member.memberId));
          listEl.appendChild(row);
        });

        countEl.textContent = `${checkedInGroup} / ${items.length}人`;
      });
    }

    function toggleMemberAtSpot(memberId) {
      const spotId = state.selectedSpotId;
      const min = state.currentMinute;
      const phaseMeta = getPhaseMetaByMinute(min);
      const applyPhase = document.getElementById("chk-apply-phase-assign").checked;
      const targetMins = applyPhase ? phaseMeta.range : [min];

      const curList = state.timeline[String(min)].deployments[spotId] || [];
      const isRemoving = curList.includes(memberId);

      const updatedSubset = {};
      targetMins.forEach(m => {
        const key = String(m);
        const mData = state.timeline[key];
        if (!mData) return;
        if (!mData.deployments) mData.deployments = {};

        // 同一時間防重疊：先將該成員從該分鐘的所有點位移出
        Object.keys(mData.deployments).forEach(sKey => {
          mData.deployments[sKey] = (mData.deployments[sKey] || []).filter(id => id !== memberId);
        });

        // 若為勾選指派，則加入當前點位
        if (!isRemoving) {
          if (!mData.deployments[spotId]) mData.deployments[spotId] = [];
          mData.deployments[spotId].push(memberId);
        }
        updatedSubset[key] = mData;
      });

      renderAssignLists();
      renderAll();
      pushToGas("saveTimeline", updatedSubset);
    }

    function saveMemberFromForm() {
      const idInput = document.getElementById("roster-input-id");
      const memberId = idInput.value.trim();
      if (!memberId) return;

      // 互斥邏輯：若該遊戲 ID 已存在於任一組，直接更新其組別與雙武學，絕不重複出現在兩組
      const existingIdx = state.members.findIndex(m => m.memberId === memberId);
      const memberObj = {
        memberId,
        martialArt1: state.rosterForm.martialArt1,
        martialArt2: state.rosterForm.martialArt2,
        group: state.rosterForm.group
      };

      if (existingIdx >= 0) {
        state.members[existingIdx] = memberObj;
      } else {
        state.members.push(memberObj);
      }

      idInput.value = "";
      renderRosterLists();
      renderAll();
      pushToGas("saveMembers");
    }

    // ============================================================================
    // 一鍵匯出當前時間點完整戰術指導圖 (1920x1080 16:9 PNG)
    // ============================================================================
    function exportTacticalPng() {
      const canvas = document.createElement("canvas");
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext("2d");

      const min = state.currentMinute;
      const minData = state.timeline[String(min)];
      const phaseMeta = getPhaseMetaByMinute(min);
      const highlightSet = new Set(phaseMeta.highlightIds);

      // 背景深色底
      ctx.fillStyle = "#0b0f17";
      ctx.fillRect(0, 0, 1920, 1080);

      // 左側 70% 地圖區域 (寬 1344, 高 1080)
      const mapW = 1344;
      const mapH = 1080;
      const imgEl = document.getElementById("base-map-img");

      try {
        ctx.drawImage(imgEl, 0, 0, mapW, mapH);
      } catch (e) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, mapW, mapH);
      }

      // 繪製左上角時間標題橫幅
      ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(24, 24, 520, 56, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#facc15";
      ctx.font = "900 26px 'Noto Sans TC', sans-serif";
      ctx.fillText(`倒數 ${min} 分鐘`, 44, 61);

      ctx.fillStyle = "#e2e8f0";
      ctx.font = "700 20px 'Noto Sans TC', sans-serif";
      ctx.fillText(`｜ ${phaseMeta.phaseLabel}`, 205, 60);

      // 繪製地圖上 21 個點位、高亮框、血量條與駐守成員名牌
      MAP_SPOTS.forEach(spot => {
        const cx = (spot.x / 100) * mapW;
        const cy = (spot.y / 100) * mapH;
        const isHighlighted = highlightSet.has(spot.id);
        const deployedIds = (minData.deployments && minData.deployments[spot.id]) ? minData.deployments[spot.id] : [];
        const hpVal = spot.hasHp ? (minData.hpStatus?.[spot.id] ?? 100) : null;

        // 目標高亮發光外框
        if (isHighlighted) {
          ctx.save();
          ctx.strokeStyle = "#facc15";
          ctx.lineWidth = 3.5;
          ctx.shadowColor = "#facc15";
          ctx.shadowBlur = 18;
          ctx.strokeRect(cx - 22, cy - 22, 44, 44);
          ctx.restore();
        }

        // 點位中心圓點
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI * 2);
        ctx.fillStyle = spot.camp === "blue" ? "#3b82f6" : spot.camp === "red" ? "#ef4444" : spot.camp === "boss" ? "#dc2626" : "#eab308";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        // 若有人牆/鵝血量，繪製於點位上方
        if (spot.hasHp) {
          const boxW = 92;
          const boxH = 22;
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.beginPath();
          ctx.roundRect(cx - boxW / 2, cy - 38, boxW, boxH, 5);
          ctx.fill();

          ctx.fillStyle = hpVal > 50 ? "#10b981" : hpVal > 20 ? "#f59e0b" : "#ef4444";
          ctx.fillRect(cx - boxW / 2 + 4, cy - 34, ((boxW - 42) * hpVal) / 100, 14);

          ctx.fillStyle = "#ffffff";
          ctx.font = "900 12px 'Noto Sans TC', sans-serif";
          ctx.fillText(`${hpVal}%`, cx + boxW / 2 - 34, cy - 23);
        }

        // 點位名稱與人數標籤
        const labelText = deployedIds.length > 0 ? `${spot.short} (${deployedIds.length}人)` : spot.short;
        ctx.font = "700 13px 'Noto Sans TC', sans-serif";
        const textW = ctx.measureText(labelText).width + 16;
        ctx.fillStyle = isHighlighted ? "rgba(234, 179, 8, 0.95)" : "rgba(15, 23, 42, 0.9)";
        ctx.beginPath();
        ctx.roundRect(cx - textW / 2, cy + 14, textW, 22, 5);
        ctx.fill();

        ctx.fillStyle = isHighlighted ? "#0f172a" : "#f8fafc";
        ctx.fillText(labelText, cx - textW / 2 + 8, cy + 29);

        // 繪製駐守於該點位的成員 ID 名牌清單
        if (deployedIds.length > 0) {
          deployedIds.forEach((mId, idx) => {
            const mObj = getMemberById(mId);
            const tagY = cy + 40 + idx * 20;
            const tagText = mObj ? `${mId} [${mObj.group.replace('組', '')}]` : mId;
            ctx.font = "700 12px 'Noto Sans TC', sans-serif";
            const tw = ctx.measureText(tagText).width + 12;

            ctx.fillStyle = mObj?.group === "進攻組" ? "rgba(225, 29, 72, 0.92)"
              : mObj?.group === "防守組" ? "rgba(2, 132, 199, 0.92)"
              : "rgba(5, 150, 105, 0.92)";
            ctx.beginPath();
            ctx.roundRect(cx - tw / 2, tagY, tw, 18, 4);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.fillText(tagText, cx - tw / 2 + 6, tagY + 13);
          });
        }
      });

      // 右側 30% 戰術看板區域 (X: 1344 ~ 1920, 寬 576)
      const panelX = 1344;
      const panelW = 576;
      ctx.fillStyle = "#111827";
      ctx.fillRect(panelX, 0, panelW, 1080);

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(panelX, 0);
      ctx.lineTo(panelX, 1080);
      ctx.stroke();

      let cursorY = 42;
      const padX = panelX + 28;
      const contentW = panelW - 56;

      // 標題與時間
      ctx.fillStyle = "#facc15";
      ctx.font = "900 28px 'Noto Sans TC', sans-serif";
      ctx.fillText(`百業戰術指導板 — ${min}分`, padX, cursorY);
      cursorY += 24;

      // 區塊：目前執行戰術名稱
      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.roundRect(padX, cursorY, contentW, 78, 10);
      ctx.fill();

      ctx.fillStyle = "#94a3b8";
      ctx.font = "700 14px 'Noto Sans TC', sans-serif";
      ctx.fillText("目前執行戰術", padX + 16, cursorY + 26);

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 22px 'Noto Sans TC', sans-serif";
      ctx.fillText(minData.tacticName || "未命名戰術", padX + 16, cursorY + 58);
      cursorY += 96;

      // 區塊：使用的指揮技能
      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.roundRect(padX, cursorY, contentW, 86, 10);
      ctx.fill();

      ctx.fillStyle = "#facc15";
      ctx.font = "700 14px 'Noto Sans TC', sans-serif";
      ctx.fillText("使用指揮技能", padX + 16, cursorY + 26);

      const skillsStr = (minData.commanderSkills && minData.commanderSkills.length > 0)
        ? minData.commanderSkills.join("  ｜  ")
        : "無特定指揮技能";
      ctx.fillStyle = "#fde047";
      ctx.font = "900 18px 'Noto Sans TC', sans-serif";
      ctx.fillText(skillsStr, padX + 16, cursorY + 58);
      cursorY += 104;

      // 區塊：戰術行動說明
      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.roundRect(padX, cursorY, contentW, 185, 10);
      ctx.fill();

      ctx.fillStyle = "#34d399";
      ctx.font = "700 14px 'Noto Sans TC', sans-serif";
      ctx.fillText("戰術行動指引", padX + 16, cursorY + 26);

      ctx.fillStyle = "#f1f5f9";
      ctx.font = "500 16px 'Noto Sans TC', sans-serif";
      const lines = (minData.tacticAction || "").split("\n");
      let lineY = cursorY + 54;
      lines.slice(0, 5).forEach(line => {
        ctx.fillText(line.substring(0, 30), padX + 16, lineY);
        lineY += 26;
      });
      cursorY += 205;

      // 區塊：各點位配置站位成員總覽
      ctx.fillStyle = "#1e293b";
      const remainH = 1080 - cursorY - 28;
      ctx.beginPath();
      ctx.roundRect(padX, cursorY, contentW, remainH, 10);
      ctx.fill();

      ctx.fillStyle = "#38bdf8";
      ctx.font = "700 15px 'Noto Sans TC', sans-serif";
      ctx.fillText("當前時間各點位站位名單", padX + 16, cursorY + 28);

      let listY = cursorY + 56;
      const activeSpots = MAP_SPOTS.filter(s => (minData.deployments?.[s.id]?.length || 0) > 0);
      if (activeSpots.length === 0) {
        ctx.fillStyle = "#64748b";
        ctx.font = "500 15px 'Noto Sans TC', sans-serif";
        ctx.fillText("此時間點尚未指派點位成員", padX + 16, listY);
      } else {
        activeSpots.slice(0, 14).forEach(s => {
          const ids = minData.deployments[s.id] || [];
          ctx.fillStyle = "#facc15";
          ctx.font = "700 14px 'Noto Sans TC', sans-serif";
          ctx.fillText(`• ${s.name} (${ids.length}人)：`, padX + 16, listY);

          ctx.fillStyle = "#e2e8f0";
          ctx.font = "500 14px 'Noto Sans TC', sans-serif";
          ctx.fillText(ids.join("、").substring(0, 24), padX + 185, listY);
          listY += 26;
        });
      }

      // 觸發下載 PNG
      const dataUrl = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.download = `百業戰術指導_${min}分_${minData.tacticName || '配置圖'}.png`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ============================================================================
    // 事件綁定與初始化
    // ============================================================================
    function bindEvents() {
      // 圖例顯示切換
      document.getElementById("btn-toggle-names").addEventListener("click", (e) => {
        state.showSpotNames = !state.showSpotNames;
        e.currentTarget.textContent = `點位名稱：${state.showSpotNames ? "開" : "關"}`;
        renderHotspots();
      });

      document.getElementById("btn-toggle-members").addEventListener("click", (e) => {
        state.showSpotMembers = !state.showSpotMembers;
        e.currentTarget.textContent = `駐守名單：${state.showSpotMembers ? "開" : "關"}`;
        renderHotspots();
      });

      // 時間軸前後 1 分鐘微調與滑鼠滾輪橫滑
      document.getElementById("btn-prev-min").addEventListener("click", () => selectMinute(state.currentMinute + 1, true));
      document.getElementById("btn-next-min").addEventListener("click", () => selectMinute(state.currentMinute - 1, true));

      const scrollBox = document.getElementById("timeline-scroll-container");
      scrollBox.addEventListener("wheel", (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          e.preventDefault();
          scrollBox.scrollLeft += e.deltaY;
        }
      }, { passive: false });

      // 人牆/大鵝血量滑桿與快捷鈕
      const hpSlider = document.getElementById("spot-hp-slider");
      hpSlider.addEventListener("input", (e) => {
        const val = Number(e.target.value);
        const spotId = state.selectedSpotId;
        const min = state.currentMinute;
        state.timeline[String(min)].hpStatus[spotId] = val;
        document.getElementById("spot-hp-label").textContent = `${val}%`;
        renderHotspots();
      });
      hpSlider.addEventListener("change", () => {
        const min = state.currentMinute;
        pushToGas("saveTimeline", { [String(min)]: state.timeline[String(min)] });
      });

      document.querySelectorAll(".hp-quick-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const val = Number(btn.dataset.hpQuick);
          const spotId = state.selectedSpotId;
          const min = state.currentMinute;
          state.timeline[String(min)].hpStatus[spotId] = val;
          renderAll();
          pushToGas("saveTimeline", { [String(min)]: state.timeline[String(min)] });
        });
      });

      // 戰術設定視窗
      document.getElementById("btn-open-tactic-modal").addEventListener("click", openTacticModal);
      document.getElementById("btn-close-tactic-modal").addEventListener("click", () => {
        document.getElementById("modal-tactic").classList.add("hidden");
      });
      document.getElementById("btn-cancel-tactic").addEventListener("click", () => {
        document.getElementById("modal-tactic").classList.add("hidden");
      });
      document.getElementById("btn-save-tactic").addEventListener("click", saveTacticModal);

      document.getElementById("btn-add-custom-skill").addEventListener("click", () => {
        const inp = document.getElementById("input-custom-skill");
        const val = inp.value.trim();
        if (!val) return;
        if (!state.availableSkills.includes(val)) state.availableSkills.push(val);
        if (!state.tempSelectedSkills.includes(val)) state.tempSelectedSkills.push(val);
        inp.value = "";
        renderSkillToggles();
      });

      // 點位成員配置視窗
      document.getElementById("btn-assign-spot-members").addEventListener("click", openAssignModal);
      document.getElementById("btn-close-assign-modal").addEventListener("click", () => {
        document.getElementById("modal-assign").classList.add("hidden");
      });
      document.getElementById("btn-done-assign").addEventListener("click", () => {
        document.getElementById("modal-assign").classList.add("hidden");
      });
      document.getElementById("btn-clear-spot-assign").addEventListener("click", () => {
        const spotId = state.selectedSpotId;
        const min = state.currentMinute;
        const phaseMeta = getPhaseMetaByMinute(min);
        const applyPhase = document.getElementById("chk-apply-phase-assign").checked;
        const targetMins = applyPhase ? phaseMeta.range : [min];
        const updatedSubset = {};
        targetMins.forEach(m => {
          const k = String(m);
          if (state.timeline[k]?.deployments) {
            state.timeline[k].deployments[spotId] = [];
            updatedSubset[k] = state.timeline[k];
          }
        });
        renderAssignLists();
        renderAll();
        pushToGas("saveTimeline", updatedSubset);
      });

      // 成員名單管理視窗與雙武學自訂下拉選單
      document.getElementById("btn-open-roster").addEventListener("click", openRosterModal);
      document.getElementById("btn-close-roster-modal").addEventListener("click", () => {
        document.getElementById("modal-roster").classList.add("hidden");
      });

      document.getElementById("btn-select-ma1").addEventListener("click", (e) => {
        e.stopPropagation();
        openCustomDropdown(e.currentTarget, MARTIAL_ARTS, state.rosterForm.martialArt1, (selected) => {
          state.rosterForm.martialArt1 = selected;
          updateRosterFormButtons();
        });
      });

      document.getElementById("btn-select-ma2").addEventListener("click", (e) => {
        e.stopPropagation();
        openCustomDropdown(e.currentTarget, MARTIAL_ARTS, state.rosterForm.martialArt2, (selected) => {
          state.rosterForm.martialArt2 = selected;
          updateRosterFormButtons();
        });
      });

      document.getElementById("btn-select-group").addEventListener("click", (e) => {
        e.stopPropagation();
        openCustomDropdown(e.currentTarget, GROUPS, state.rosterForm.group, (selected) => {
          state.rosterForm.group = selected;
          updateRosterFormButtons();
        });
      });

      document.getElementById("btn-save-member").addEventListener("click", saveMemberFromForm);

      // 匯出戰術圖片按鈕
      document.getElementById("btn-export-png").addEventListener("click", exportTacticalPng);

      // 點擊同步狀態徽章手動重整
      const syncBadge = document.getElementById("sync-status-badge");
      if (syncBadge) {
        syncBadge.addEventListener("click", () => {
          fetchFromGas();
        });
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadLocalState();
      bindEvents();
      updateRosterFormButtons();
      renderAll();
      fetchFromGas();
    });
  </script>
</body>
</html>
